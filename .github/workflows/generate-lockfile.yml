name: Generate package lockfile

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.head_ref == 'agent/foundation-hardening'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: agent/foundation-hardening

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile if needed
        run: |
          if git status --porcelain -- package-lock.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Refresh package lockfile"
            git push origin HEAD:agent/foundation-hardening
          else
            echo "package-lock.json is already current."
          fi
